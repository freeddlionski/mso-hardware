name: KiCad — проверка схемы и выгрузка

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths: ['plata/kicad/**', '.github/workflows/kicad.yml']
  pull_request:
    paths: ['plata/kicad/**', '.github/workflows/kicad.yml']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:9.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Версия KiCad и таблицы библиотек
        run: |
          kicad-cli version
          mkdir -p ~/.config/kicad/9.0
          cp /usr/share/kicad/template/sym-lib-table ~/.config/kicad/9.0/ || true
          cp /usr/share/kicad/template/fp-lib-table ~/.config/kicad/9.0/ || true

      - name: ERC схемы
        run: |
          set -e
          SCH=$(ls plata/kicad/*.kicad_sch 2>/dev/null | head -1 || true)
          if [ -z "$SCH" ]; then echo "Схемы пока нет — пропуск"; exit 0; fi
          mkdir -p out
          ROOT=plata/kicad/mso74-plata.kicad_sch
          kicad-cli sch erc --format report --severity-all --output out/erc.rpt "$ROOT" || true
          echo "===== ERC ====="; cat out/erc.rpt
          # Ошибки ERC валят проверку, предупреждения — нет
          kicad-cli sch erc --severity-error --exit-code-violations --output out/erc_err.rpt "$ROOT"

      - name: PDF и BOM
        if: always()
        run: |
          [ -f plata/kicad/mso74-plata.kicad_sch ] || exit 0
          mkdir -p out
          kicad-cli sch export pdf --output out/mso74-plata-schematic.pdf plata/kicad/mso74-plata.kicad_sch
          kicad-cli sch export netlist --format kicadsexpr --output out/mso74-plata.net plata/kicad/mso74-plata.kicad_sch
          kicad-cli sch export netlist --format kicadxml --output out/mso74-plata.xml plata/kicad/mso74-plata.kicad_sch
          # полный инженерный перечень (с DNP) и сборочный для JLCPCB — без DNP (аудит Codex C-006: иначе запаяют R59/R60)
          kicad-cli sch export bom --output out/bom_full.csv \
            --fields 'Reference,Value,Footprint,LCSC,${DNP},${QUANTITY}' --group-by 'Value,Footprint,LCSC,${DNP}' \
            plata/kicad/mso74-plata.kicad_sch
          kicad-cli sch export bom --output out/bom.csv --exclude-dnp \
            --fields 'Reference,Value,Footprint,LCSC,${QUANTITY}' --group-by 'Value,Footprint,LCSC' \
            plata/kicad/mso74-plata.kicad_sch
          echo "===== BOM для сборки (без DNP) ====="; cat out/bom.csv
          if grep -E '(^|[",])"?(R59|R60|C81|J6|J17)"?([",]|$)' out/bom.csv; then echo "DNP попали в сборочный BOM"; exit 1; fi

      - name: Свои посадочные места (KiCad должен их прочитать)
        if: always()
        run: |
          [ -d plata/kicad/lib/mso74.pretty ] || exit 0
          mkdir -p out/fp
          kicad-cli fp export svg --output out/fp plata/kicad/lib/mso74.pretty
          ls -l out/fp

      - name: Плата из раскладки (pcbnew)
        run: |
          set -e
          [ -f plata/kicad/placement.json ] || { echo "Раскладки нет — пропуск"; exit 0; }
          python3 plata/kicad/gen/pcb_build.py out/mso74-plata.net plata/kicad/placement.json plata/kicad/mso74-plata.kicad_pcb
          cp plata/kicad/mso74-plata.kicad_pcb out/mso74-plata-unrouted.kicad_pcb

      - name: Трассировка (Freerouting)
        timeout-minutes: 90
        run: |
          set -e
          [ -f plata/kicad/mso74-plata.kicad_pcb ] || { echo "Платы нет — пропуск"; exit 0; }
          python3 plata/kicad/gen/pcb_route.py prep plata/kicad/mso74-plata.kicad_pcb out/mso74-plata.dsn
          mkdir -p /tmp/fr && cd /tmp/fr
          python3 - <<'PY'
          import json, urllib.request, tarfile, io
          r = json.load(urllib.request.urlopen('https://api.github.com/repos/freerouting/freerouting/releases/latest'))
          jar = [a for a in r['assets'] if a['name'].endswith('.jar')][0]
          print('Freerouting', r['tag_name'], jar['name'])
          urllib.request.urlretrieve(jar['browser_download_url'], 'freerouting.jar')
          u = 'https://api.adoptium.net/v3/binary/latest/25/ga/linux/x64/jre/hotspot/normal/eclipse'
          req = urllib.request.Request(u, headers={'User-Agent': 'curl/8.0'})
          tarfile.open(fileobj=io.BytesIO(urllib.request.urlopen(req).read())).extractall('jre')
          PY
          JAVA=$(ls -d /tmp/fr/jre/*/bin/java)
          cd "$GITHUB_WORKSPACE"
          "$JAVA" -jar /tmp/fr/freerouting.jar -de out/mso74-plata.dsn -do out/mso74-plata.ses -mp 30 -mt 4 \
            --gui.enabled=false 2>&1 | tail -60
          [ -s out/mso74-plata.ses ] || { echo "Freerouting не выдал SES"; exit 1; }
          python3 plata/kicad/gen/pcb_route.py finish plata/kicad/mso74-plata.kicad_pcb out/mso74-plata.ses
          cp plata/kicad/mso74-plata.kicad_pcb out/

      - name: DRC платы
        if: always()
        run: |
          [ -f plata/kicad/mso74-plata.kicad_pcb ] || { echo "Платы пока нет — пропуск"; exit 0; }
          kicad-cli pcb drc --format json --severity-all --output out/drc.json plata/kicad/mso74-plata.kicad_pcb || true
          kicad-cli pcb drc --format report --severity-all --output out/drc.rpt plata/kicad/mso74-plata.kicad_pcb || true
          python3 - <<'PY'
          import json, collections
          d = json.load(open('out/drc.json'))
          c = collections.Counter(v['type'] for v in d.get('violations', []))
          print('===== DRC: нарушения по типам (без дорожек «unconnected» — норма) =====')
          for k, n in c.most_common(): print('%5d  %s' % (n, k))
          print('не разведено связей:', len(d.get('unconnected_items', [])))
          for v in d.get('violations', []):
              if v['type'] not in ('unconnected_items',):
                  print('  -', v['type'], '|', v['description'], '|', ' / '.join(i['description'] for i in v.get('items', [])))
          PY
          kicad-cli pcb export svg --layers F.Cu,F.SilkS,F.Fab,F.CrtYd,Edge.Cuts --mode-single --page-size-mode 2 \
            --exclude-drawing-sheet --output out/plata-front.svg plata/kicad/mso74-plata.kicad_pcb || true
          for L in F.Cu In1.Cu In2.Cu B.Cu; do
            kicad-cli pcb export svg --layers $L,Edge.Cuts --mode-single --page-size-mode 2 --exclude-drawing-sheet \
              --output out/layer-$L.svg plata/kicad/mso74-plata.kicad_pcb || true
          done
          kicad-cli pcb render --side top --width 2400 --height 1300 --output out/plata-3d.png \
            plata/kicad/mso74-plata.kicad_pcb || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kicad-out
          path: out/
          if-no-files-found: ignore

      - name: Выгрузка в ветку kicad-out (main) или kicad-out-pr (PR) — смотреть без скачивания артефакта
        if: always()
        run: |
          [ -f out/mso74-plata-schematic.pdf ] || exit 0
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BR=kicad-out; [ "${{ github.event_name }}" = "pull_request" ] && BR=kicad-out-pr
          cd out && git init -q -b "$BR" && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Выгрузка ${GITHUB_REF_NAME} ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "$BR"
