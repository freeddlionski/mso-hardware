name: KiCad — снимок официальных библиотек

# Запускается вручную. Кладёт в ветку kicad-libs официальные символы KiCad 9 по нужным разделам
# и список посадочных мест — помощник собирает схему из настоящих символов, а не рисует выводы сам.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:9.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Снимок
        run: |
          set -e
          SYM=/usr/share/kicad/symbols
          FP=/usr/share/kicad/footprints
          ls -d $SYM $FP
          mkdir -p snap/symbols
          for L in power Device RF_Module Interface_Ethernet Interface_UART Interface_USB Timer_RTC 74xx \
                   Regulator_Switching Regulator_Linear Isolator Connector Connector_Generic Power_Protection \
                   Transistor_FET Transistor_BJT Diode Switch Mechanical 74xGxx Interface Battery Interface_Expansion Power_Management; do
            cp "$SYM/$L.kicad_sym" snap/symbols/ || echo "нет библиотеки $L"
          done
          mkdir -p footprints
          # все библиотеки посадочных мест, которые использует схема (для сверки с чертежами производителей)
          for P in Battery Button_Switch_SMD Capacitor_SMD Connector_IDC Connector_Molex Connector_Phoenix_MC \
                   Connector_Phoenix_MSTB Connector_PinHeader_2.54mm Connector_RJ Connector_USB Crystal Diode_SMD Fuse \
                   Inductor_SMD LED_SMD Package_DIP Package_QFP Package_SO Package_TO_SOT_SMD RF_Module Resistor_SMD; do
            cp -r "$FP/$P.pretty" footprints/ || echo "нет $P"
          done
          mv footprints snap/
          for d in $FP/*.pretty; do
            n=$(basename "$d" .pretty)
            ls "$d" | sed "s/\.kicad_mod$//; s/^/$n:/"
          done > snap/footprints.txt
          kicad-cli version > snap/VERSION
          wc -l snap/footprints.txt; du -sh snap
      - name: В ветку kicad-libs
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan kicad-libs
          git rm -rf --cached . >/dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name snap -exec rm -rf {} +
          mv snap/* . && rmdir snap
          git add -A
          git commit -m "Снимок библиотек KiCad $(cat VERSION)"
          git push -f origin kicad-libs
