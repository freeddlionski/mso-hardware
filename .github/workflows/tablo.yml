name: Правка готовой платы: клеммы табло (pcb_tablo.py)

# Меняется pcb_silk.py в рабочей ветке → раскладываем обозначения на plata/kicad/routed и коммитим плату в ту же ветку.
# Медь и детали не трогаются. Проверка результата — обычный kicad.yml в PR.

permissions:
  contents: write

on:
  push:
    branches-ignore: [main]
    paths: ['plata/kicad/gen/pcb_tablo.py']
  workflow_dispatch:

jobs:
  silk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: kicad/kicad:9.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Обозначения
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd plata/kicad/gen && python3 pcb_tablo.py ../routed/mso74-plata.kicad_pcb
      - name: Коммит в ветку
        run: |
          git add plata/kicad/routed
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -qm "Табло: винтовые клеммы J3/J4, подпись HUB75 (pcb_tablo.py)" || exit 0
          git push -q origin HEAD:${GITHUB_REF_NAME}
